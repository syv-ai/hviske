[project]
name = "hviske"
version = "0.0.0"
description = "Hviske provides Danish ASR and TTS models associated with the CoRal project."
readme = "README.md"
authors = [
    {name = "Dan Saattrup Smart", email = "dan@syv.ai"},
]
maintainers = [
    {name = "Dan Saattrup Smart", email = "dan@syv.ai"},
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.9.0",
    "click>=8.2.1",
    "ctc-segmentation==1.7.4",
    "datasets>=3.6.0,<4.0.0",
    "deepspeed>=0.17.4",
    "hydra-core>=1.1.1",
    "jiwer>=4.0.0",
    "joblib>=1.5.1",
    "librosa>=0.11.0",
    "mlflow>=3.1.4",
    "openpyxl>=3.1.5",
    "progress>=1.6.1",
    "pycountry>=24.6.1",
    "pyctcdecode>=0.5.0",
    "pydantic>=2.0",
    "pydub>=0.25.1",
    "pysubs2>=1.8.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.4",
    "safetensors>=0.7.0",
    "scipy>=1.16.3",
    "sentencepiece>=0.2.2",
    "soundfile>=0.13.1",
    "torch-audiomentations>=0.12.0",
    "torchaudio>=2.6.0,<2.7.0",  # Upper bound for compatibility with audiomentations
    "transformers>=5.5.0",
    "wandb>=0.23.1",
]

[project.optional-dependencies]
kenlm = [
    "kenlm",
]
demo = [
    "gradio>=5.31.0",
    "punctfix>=0.11.1",
    "samplerate>=0.2.2",
]
plotting = [
    "matplotlib>=3.9.2",
]

[project.urls]
Repository = "https://github.com/syv-ai/hviske"
Issues = "https://github.com/syv-ai/hviske/issues"

[project.license]
file = "LICENSE"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0",
    "readme-coverage-badger>=0.1.2",
    "click>=8.1.7",
    "ruff>=0.7.1",
    "nbstripout>=0.7.1",
    "coverage>=5.5",
    "lxml>=6.1.0",
    "pip>=26.1.2",
    "setuptools>=83.0.0",
    "ty>=0.0.40",
    "vulture>=2.16",
]
quality = [
    "slopo>=0.5.0; python_version >= '3.12'",
]

[tool.uv.sources]
kenlm = { url = "https://github.com/kpu/kenlm/archive/master.zip" }

[tool.uv]
# Slopo currently declares NumPy 2.5, while pyctcdecode (used by the n-gram
# decoder) declares NumPy <2. Keep the supported project NumPy line until
# pyctcdecode publishes a compatible release; Slopo's array API works with it.
override-dependencies = ["numpy>=1.26.0,<2.0.0"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "vulture_whitelist.py",
]
extend-include = [
    "*.ipynb",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
select = [
    # isort (imports)
    "I",
    # Docstrings
    "D",
    "DOC",
    # pycodestyle errors and warnings (PEP8)
    "E",
    "W",
    # flake-annotations (type hints)
    "ANN",
    # Pyflakes
    "F",
]
ignore = [
    # Type annotations for "self" arguments
    "ANN101",
    # Type annotations for "cls" arguments
    "ANN102",
    # Type annotations for *args
    "ANN002",
    # Type annotations for **kwargs
    "ANN003",
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = [
    "F401",
]
"src/scripts/main.py" = [
    "I",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
exclude = ["vulture_whitelist.py"]

[tool.ty.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"

[tool.vulture]
paths = ["src", "tests", "vulture_whitelist.py"]
min_confidence = 80

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    '--durations=10',
    '--color=yes',
    '--doctest-modules',
    '--cov=src/hviske',
    '-vvv',
]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ImportWarning",
    "ignore::ResourceWarning",
    "ignore::FutureWarning",
]
log_cli_level = "info"
testpaths = [
    "tests",
    "src/hviske",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
