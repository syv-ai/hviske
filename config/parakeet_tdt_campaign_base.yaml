# Shared defaults for the serial Parakeet-TDT campaign presets.
defaults:
  - model: parakeet-tdt
  - experiment_tracking: wandb
  - override hydra/job_logging: custom
  - _self_

seed: 4242
evaluation_lower_case: true
evaluation_characters_to_keep: 'abcdefghijklmnopqrstuvwxyzæøå0123456789éü'
# CoRal read-aloud and conversation are the Danish leaderboard-aligned checks;
# English presets replace this list with these plus LibriSpeech/FLEURS English.
evaluation_datasets:
  - id: CoRal-project/coral-v3
    subset: read_aloud
    val_name: val
    text_column: text
    audio_column: audio
    language: da
    revision: 01f7c93c21fc9dec87fe9f7149c79569cc433f08
    trust_remote_code: false
  - id: CoRal-project/coral-v3
    subset: conversation
    val_name: val
    text_column: text
    audio_column: audio
    language: da
    revision: 01f7c93c21fc9dec87fe9f7149c79569cc433f08
    trust_remote_code: false
  - id: google/fleurs
    subset: da_dk
    val_name: validation
    text_column: raw_transcription
    audio_column: audio
    language: da
    revision: 70bb2e84b976b7e960aa89f1c648e09c59f894dd
    trust_remote_code: false

max_validation_samples_per_dataset: 1000
min_seconds_per_example: 1.0
max_seconds_per_example: 8.0
dataset_num_workers: 0
dataloader_num_workers: 0
streaming: true
cache_dir: null
shuffle_buffer_size: 1
hub_streaming_retries:
  base_delay_seconds: 1.0
  max_delay_seconds: 30.0
  jitter_seconds: 0.5
padding: longest
evaluation_status: Campaign validation suite ran during training.

require_cuda: true
models_dir: models
model_dir: ${models_dir}/${model_id}
hub_organisation: syvai
push_to_hub: false
create_pr: false
private: true
private_only: true
model_card_languages: [da, en]
fp16_allowed: true
bf16_allowed: true
resume_from_checkpoint: false
ignore_data_skip: false
save_total_limit: 8
enable_experiment_tracking: true

adam_first_momentum: 0.9
adam_second_momentum: 0.98
total_batch_size: 60
per_device_batch_size: 4
warmup_steps: 1000
logging_steps: 10
eval_steps: 500
evaluation_steps: null
evaluation_metrics_path: null
save_steps: 500
early_stopping: false
early_stopping_patience: 50
max_grad_norm: 1.0
gradient_checkpointing: true
