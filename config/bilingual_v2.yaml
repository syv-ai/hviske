# Bilingual v2 Parakeet TDT training preset.
defaults:
  - model: parakeet-tdt
  - datasets:
    - p1
    - drtv_local
    - youtube_local
    - coral_read_aloud
    - coral_conversation
    - ftspeech
    - nota
    - nst
    - peoples_speech_clean
    - ami_sdm
    - ami_ihm
    - voxpopuli_en
    - librispeech_clean_train_100
    - librispeech_clean_train_360
    - librispeech_other_train_500
    - common_voice_19_en
  - experiment_tracking: wandb
  - override hydra/job_logging: custom
  - _self_

seed: 4242

model:
  learning_rate: 5e-6

evaluation_lower_case: true
evaluation_characters_to_keep: 'abcdefghijklmnopqrstuvwxyzæøå0123456789éü'
evaluation_datasets:
  - id: CoRal-project/coral-v3
    subset: read_aloud
    val_name: val
    text_column: text
    audio_column: audio
    language: da
    revision: 01f7c93c21fc9dec87fe9f7149c79569cc433f08
    trust_remote_code: false
  - id: CoRal-project/coral-v3
    subset: conversation
    val_name: val
    text_column: text
    audio_column: audio
    language: da
    revision: 01f7c93c21fc9dec87fe9f7149c79569cc433f08
    trust_remote_code: false
  - id: openslr/librispeech_asr
    subset: clean
    val_name: validation
    text_column: text
    audio_column: audio
    language: en
    revision: 71cacbfb7e2354c4226d01e70d77d5fca3d04ba1
    trust_remote_code: false
  - id: openslr/librispeech_asr
    subset: other
    val_name: validation
    text_column: text
    audio_column: audio
    language: en
    revision: 71cacbfb7e2354c4226d01e70d77d5fca3d04ba1
    trust_remote_code: false
  - id: google/fleurs
    subset: en_us
    val_name: validation
    text_column: raw_transcription
    audio_column: audio
    language: en
    revision: 70bb2e84b976b7e960aa89f1c648e09c59f894dd
    trust_remote_code: false

max_validation_samples_per_dataset: 1000

min_seconds_per_example: 1.0
max_seconds_per_example: 8.0
# Keep Hub-stream preprocessing in the parent process. The configured one worker is
# normalised to num_proc=None, avoiding forks while Hub HTTP connections are live.
dataset_num_workers: 1
# Two spawned workers balance throughput and bounded host memory for the TDT workload.
dataloader_num_workers: 2
streaming: true
cache_dir: null
# Keep already-sharded Hub sources cheap to start; sources can override this.
shuffle_buffer_size: 1
# Bounded retries apply only to hf:// streaming reads; local files are unchanged.
hub_streaming_retries:
  max_retries: 6
  base_delay_seconds: 1.0
  max_delay_seconds: 30.0
  jitter_seconds: 0.5
padding: longest

# Probabilities follow nominal raw row counts within each language. The first eight
# entries are Danish (65%), and the final eight are English (35%). At 381,000 steps
# with a total batch size of 60, this gives approximately 1.002 Danish and 2.438
# English nominal raw-row epochs for every stream.
dataset_probabilities:
  - 0.208896 # p1
  - 0.225365 # drtv_local
  - 0.140233 # youtube_local
  - 0.013111 # coral_read_aloud
  - 0.006451 # coral_conversation
  - 0.043623 # ftspeech
  - 0.004320 # nota
  - 0.008001 # nst
  - 0.160100 # peoples_speech_clean
  - 0.011445 # ami_sdm
  - 0.011571 # ami_ihm
  - 0.019460 # voxpopuli_en
  - 0.003043 # librispeech_clean_train_100
  - 0.011092 # librispeech_clean_train_360
  - 0.015857 # librispeech_other_train_500
  - 0.117432 # common_voice_19_en

# Exact source metadata included when the finetuning entry point publishes privately.
training_dataset_ids:
  - syvai/p1-segments
  - syvai/danish-asr-unified
  - MLCommons/peoples_speech
  - edinburghcstr/ami
  - facebook/voxpopuli
  - openslr/librispeech_asr
  - fsicoli/common_voice_19_0

require_cuda: true
model_id: ${model.name}-${now:%Y-%m-%d}
models_dir: models
model_dir: ${models_dir}/${model_id}
hub_organisation: syvai
push_to_hub: false
create_pr: false
private: true
private_only: true
model_card_languages:
  - da
  - en
fp16_allowed: true
bf16_allowed: true

resume_from_checkpoint: false
ignore_data_skip: false
save_total_limit: 3
enable_experiment_tracking: true

# Production W&B tracking. Run names, groups, IDs, and resume policy are supplied by
# the launcher. The entity is unset so W&B uses the authenticated default workspace.
experiment_tracking:
  name_experiment: hviske
  entity: null
  job_type: train
  tags:
    - bilingual
    - production
    - parakeet-tdt
    - max8s
  mode: online
  save_code: true
  log_model: false
  watch: false
  production: true

adam_first_momentum: 0.9
adam_second_momentum: 0.98
total_batch_size: 60
per_device_batch_size: 6
# Keep the cosine scheduler at the full horizon; bounded pilots use the callback.
max_steps: 381_000
stop_after_steps: null
warmup_steps: 1_000
logging_steps: 10
eval_steps: 2_000
evaluation_steps: null
evaluation_metrics_path: null
save_steps: 500
early_stopping: false
early_stopping_patience: 50
max_grad_norm: 1.0
gradient_checkpointing: true
