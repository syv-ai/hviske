# Trainable Danish anchor checkpoint for the Olmix calibration matrix.
name: hviske-v5-tiny
type: cohere
pretrained_model_id: syvai/hviske-v5-tiny
freeze_feature_encoder: false

# Cohere prompt and audio settings.
lower_case: false
characters_to_keep: null
language: da
punctuation: true
sampling_rate: 16_000
max_length: 256

# The checkpoint has no published fine-tuning recipe; use the existing native
# Cohere learning-rate scale as a conservative calibration proxy.
learning_rate: 1.0e-5
