# Phase 1C contract configuration. Every revision is immutable and complete.
# Use mode=plan for a Hub-metadata-only preflight; initialise creates the private
# target card, while pilot and production are bounded builds.
pipeline_version: p1-segmentation-4
mode: plan
programme_limit: null
source_file_id: null
resume: true
# Optional command-line overrides (for example max_source_bytes=100000000).
max_source_bytes: null
max_scratch_bytes: null
shards_per_commit: null
schema_version: p1-segments-v1

source:
  audio:
    repository: syvai/p1
    revision: 449b9c2294026df6d0d37538f279fdec03f565ff
  transcripts:
    repository: syvai/p1-transcripts
    revision: 41132579816d86e889635f84f30511279f026359
  join_key: file_id
  text_column: transcript_text

vad:
  name: silero-vad
  repository:
    repository: snakers4/silero-vad
    revision: 867c2aa692646a1f1de3e94a15c9dd9f614c0acb
  model_path: src/silero_vad/data/silero_vad.jit
  model_blob: 5c6988d663950a93a5f0d6c38c2fe024653ec552
  model_sha256: e1122837f4154c511485fe0b9c64455f7b929c96fbb8d79fbdb336383ebd3720
  license: MIT

ctc:
  name: ctc-segmentation
  version: 1.7.4
  source_commit: 69bd9b53b7b82ad926d35e7b280f957ed299a7db
  sdist_sha256: 19d383ea5f22438ebb1699d72b22078b63f351a33fa50bedb19c14077ba6a116
  license: Apache-2.0
  model:
    repository:
      repository: CoRal-project/roest-v3-wav2vec2-315m
      revision: beb3e790246d6b9dec1df596b0b21d5c42f4d99c
    license: openrail
    license_url: https://huggingface.co/Alvenir/coral-1-whisper-large/blob/main/LICENSE
    license_notes: >-
      Model card metadata is openrail; the card describes a custom OpenRAIL-M
      licence permitting commercial use with restrictions on speech synthesis
      and biometric identification. P1 uses the model for ASR alignment only.
    architecture: Wav2Vec2ForCTC
    model_type: wav2vec2
    sampling_rate: 16000
    frame_stride_samples: 320
    vocab_size: 46
    blank_token_id: 45
    word_delimiter_token_id: 36

anomaly_model:
  repository:
    repository: openai/whisper-small
    revision: 973afd24965f72e36ca33b3055d56a652f456b4d
  license: Apache-2.0

normalisation:
  version: p1-text-normalisation-3
  source_text_ownership: following-timed-word-with-terminal-suffix-v1
  unicode_form: NFC
  case_folding: true
  punctuation_removed: true
  number_expansion: false
  preserves_source_word_map: true

segmentation:
  minimum_duration_ms: 1000
  target_minimum_duration_ms: 2000
  target_maximum_duration_ms: 8000
  maximum_duration_ms: 9999
  maximum_drift_ms: 500
  # Pilot-tunable: ctc-segmentation returns mean log probabilities <= 0.
  minimum_alignment_score: -10.0
  minimum_vad_speech_ratio: 0.0

output:
  audio_format: flac
  sampling_rate: 16000
  channels: 1
  shard_format: parquet

runtime:
  scratch_root: /scratch/syvai/p1-segmentation
  max_source_bytes: 6197291423
  max_scratch_bytes: 68719476736
  workers: 1
  queue_slots: 1
  upload_concurrency: 1
  verification_concurrency: 1
  # Keep projected source access bounded to a modest Arrow batch.
  source_max_batch_rows: 1024
  source_max_batch_bytes: 67108864
  # 2 GiB covers the observed ~58-minute, 48 kHz mono P1 programme as float32
  # PCM while bounding compressed-audio expansion before libsndfile allocation.
  max_decoded_audio_bytes: 2147483648
  device: cuda:0
  shards_per_commit: 8
  target_shard_bytes: 500000000
  target_private_repo: syvai/p1-segments

# ctc-forced-aligner is intentionally excluded: its licence metadata is contradictory.
excluded:
  - ctc-forced-aligner
