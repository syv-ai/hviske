# Final immutable full bilingual campaign: 381k steps and a 65/35 Danish/English mix.
# This is compositionally equivalent to bilingual_v2, but has a unique campaign ID;
# bilingual_v2.yaml itself remains historical and unchanged.
defaults:
  - parakeet_tdt_campaign_base
  - parakeet_tdt_english_eval
  - datasets:
      - coral_read_aloud
      - coral_conversation
      - ftspeech
      - fleurs
      - common_voice_19
      - p1
      - drtv_local
      - youtube_local
      - nota
      - nst
      - peoples_speech_clean
      - ami_sdm
      - ami_ihm
      - voxpopuli_en
      - librispeech_clean_train_100
      - librispeech_clean_train_360
      - librispeech_other_train_500
      - common_voice_19_en
  - _self_

model_id: parakeet-tdt-bilingual-65-35-v1
max_steps: 381000
datasets:
  coral_read_aloud: {max_train_samples: 299255}
  coral_conversation: {max_train_samples: 147249}
  ftspeech: {max_train_samples: 995677}
  fleurs: {max_train_samples: 1032}
  common_voice_19: {max_train_samples: 3484}
  p1: {max_train_samples: 4767938}
  drtv_local: {max_train_samples: 5143820}
  youtube_local: {max_train_samples: 3200734}
  nota: {max_train_samples: 98600}
  nst: {max_train_samples: 182605}
  peoples_speech_clean: {max_train_samples: 1501271}
  ami_sdm: {max_train_samples: 107319}
  ami_ihm: {max_train_samples: 108502}
  voxpopuli_en: {max_train_samples: 182482}
  librispeech_clean_train_100: {max_train_samples: 28539}
  librispeech_clean_train_360: {max_train_samples: 104014}
  librispeech_other_train_500: {max_train_samples: 148688}
  common_voice_19_en: {max_train_samples: 1101170}
# Within each language, probabilities are proportional to the full caps; language
# totals are exactly 65% Danish and 35% English.
dataset_probabilities:
  - 0.013107182330
  - 0.006449414348
  - 0.043610031513
  - 0.000045200956
  - 0.000152597027
  - 0.208832710237
  - 0.225296107367
  - 0.140190152633
  - 0.004318618495
  - 0.007997985094
  - 0.160099710998
  - 0.011444796366
  - 0.011570954773
  - 0.019460387540
  - 0.003043478261
  - 0.011092341982
  - 0.015856501477
  - 0.117431828604
training_dataset_ids:
  - syvai/danish-asr-unified
  - google/fleurs
  - fsicoli/common_voice_19_0
  - syvai/p1-segments
  - MLCommons/peoples_speech
  - edinburghcstr/ami
  - facebook/voxpopuli
  - openslr/librispeech_asr
