coral_conversation:
  id: syvai/danish-asr-unified
  subset: default
  train_name: train
  text_column: text
  audio_column: audio
  filter_dataset: true
  filters:
    source: coral_conversation
  language: da
  revision: 5a3a49ee981baab6e1e37ddd2c45f9943c27d08f
  trust_remote_code: false
  overlay:
    id: syvai/danish-asr-unified-hviske-v5-tiny
    subset: default
    split: train
    revision: ${oc.env:HVISKE_OVERLAY_REVISION,""}
    strategy: positional
    base_filters:
      source: coral_conversation
    filters:
      source: coral_conversation
    equality_checks:
      source: source
      text: reference_text
    action_column: action
    allowed_actions: [keep, relabel, strip]
    recognised_actions: [keep, relabel, strip, drop, flag, quarantine, review]
    text_policy:
      candidates:
        - column: new_text
          actions: [relabel, strip]
        - column: reference_text
    trust_remote_code: false
