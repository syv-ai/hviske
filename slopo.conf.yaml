# Slopo configuration for Hviske.
# Run: uv run slopo index && uv run slopo embed && uv run slopo analyze
#
# Slopo uses a local llama.cpp embedding server when `make check` detects one.

source_dir: src
source_dir_exclude:
  - "**/tests/**"
  - "**/__pycache__/**"
  - "**/*.pyc"

db_file: .slopo/slopo.db
report_dir: .slopo/report
ignore_file: .slopo/slopo.ignore.txt

embedding_model: openai/jina-code-embeddings-0.5b
embedding_dimensions: 896
embedding_api_key: ""
embedding_params:
  api_base: http://localhost:8080/v1
